openapi: 3.0.3
info:
  title: Map Schema API
  version: "1.0"

components:
  schemas:
    Dinosaur:
      type: object
      required: [name]
      properties:
        name:
          type: string
    DinosaurLookup:
      type: object
      description: A lookup of dinosaurs by identifier.
      additionalProperties:
        $ref: '#/components/schemas/Dinosaur'
    StringScores:
      type: object
      additionalProperties:
        type: integer
    FreeformMap:
      type: object
      additionalProperties: true
    Herd:
      type: object
      required: [members]
      properties:
        members:
          $ref: '#/components/schemas/DinosaurLookup'
